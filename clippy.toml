allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "blocks the calling thread; run processes only inside an adapter on the background executor and add #[expect(clippy::disallowed_methods, reason = ...)]" },
    { path = "std::process::Command::output", reason = "blocks the calling thread; run processes only inside an adapter on the background executor and add #[expect(clippy::disallowed_methods, reason = ...)]" },
    { path = "std::process::Command::status", reason = "blocks the calling thread; run processes only inside an adapter on the background executor and add #[expect(clippy::disallowed_methods, reason = ...)]" },
    { path = "std::thread::sleep", reason = "blocks the thread; in GPUI code use cx.background_executor().timer(..)" },
    { path = "serde_json::from_reader", reason = "slow; read into a buffer and use from_slice" },
]
