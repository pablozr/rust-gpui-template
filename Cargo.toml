[workspace]
resolver = "3"
members = [
    "crates/myapp-core",
    "crates/myapp-domain",
    "crates/myapp-storage",
    "crates/myapp-ui",
    "tests/architecture",
    "apps/myapp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Pinned to one Zed commit (docs/adr/0001-gpui-pinned-to-zed-rev.md). Bump both lines together.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "244023605536a412ab6b8d5b658466b89fb15401" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "244023605536a412ab6b8d5b658466b89fb15401", features = ["font-kit", "wayland", "x11"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
unwrap_used = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
mod_module_files = "warn"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
manual_let_else = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
