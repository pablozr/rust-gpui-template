name: Release

# Builds the installers when a version tag is pushed (v0.1.0...), or by hand from the Actions
# tab. The files are attached to the run as artifacts; publishing a GitHub Release with them is a
# separate, manual step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libzstd-dev libssl-dev libasound2-dev libfuse2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-packager@0.11.8
      - name: Build the installers
        working-directory: apps/myapp
        shell: bash
        env:
          FORMATS: ${{ matrix.formats }}
        run: cargo packager --release --formats "$FORMATS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myapp-${{ matrix.os }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
          if-no-files-found: error
