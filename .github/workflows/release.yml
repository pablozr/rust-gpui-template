name: Release

# Builds the installers when a version tag is pushed (v0.1.0...), or by hand from the Actions
# tab. The files are attached to the run as artifacts; publishing a GitHub Release with them is a
# separate, manual step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libzstd-dev libssl-dev libasound2-dev libfuse2
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the installers
        working-directory: apps/myapp
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: myapp-${{ matrix.os }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
          if-no-files-found: error
